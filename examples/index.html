<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Render engine</title>
  <!-- three.js y, solo para el render final, three-gpu-pathtracer (que pide three/examples/jsm/ y three-mesh-bvh) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js",
        "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.23/build/index.module.js"
      }
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font: 13px system-ui, sans-serif; }
    #barra { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
    #barra button, #barra select { font: inherit; padding: 5px 9px; border-radius: 6px; border: 1px solid #0003; background: #fffd; cursor: pointer; }
    #salida { position: absolute; right: 12px; bottom: 12px; max-width: 40vw; border: 1px solid #0003; display: none; }
  </style>
</head>
<body>
  <div id="barra">
    <select id="preset"></select>
    <select id="modo"></select>
    <button data-show="grid">grilla</button>
    <button data-show="sky">cielo</button>
    <button data-show="fog">niebla</button>
    <button data-show="shadows">sombras</button>
    <button id="bordes">contorno fino</button>
    <button id="render">render</button>
    <button data-orbit="-45">↺ 45°</button>
    <button data-orbit="45">↻ 45°</button>
    <select id="vista"></select>
    <button id="encuadrar">encuadrar</button>
    <button id="guardar">guardar vista</button>
    <button id="volver">volver a la vista</button>
  </div>
  <img id="salida" alt="render" />
  <script type="module">
    import * as THREE from 'three';
    import { createEngine, PRESETS, MODES } from '../src/index.js';

    const motor = createEngine(document.body, { preset: 'studio', area: 250 });
    const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, ...extra });
    const piezas = [
      // un material por cara: el caso de varios materiales en una malla (ver porGrupo en pathtracer.js)
      new THREE.Mesh(new THREE.BoxGeometry(60, 3, 40), ['#b9895c', '#b9895c', '#d8b48a', '#7a5636', '#c8a27a', '#c8a27a'].map((c) => mat(c))),
      new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 30, 48), mat('#5d7fa3', { metalness: 0.6, roughness: 0.25 })),
      new THREE.Mesh(new THREE.TorusKnotGeometry(8, 2.6, 160, 24), mat('#c9743f', { roughness: 0.3 })),
    ];
    piezas[0].position.set(0, 40, 0);
    piezas[1].position.set(-12, 56.5, 0);
    piezas[2].position.set(14, 52, 4);
    for (let i = 0; i < 4; i++) {
      const pata = new THREE.Mesh(new THREE.BoxGeometry(4, 38.5, 4), mat('#a8825c'));
      pata.position.set(i % 2 ? 26 : -26, 19.25, i < 2 ? 16 : -16);
      piezas.push(pata);
    }
    for (const p of piezas) { p.castShadow = p.receiveShadow = true; motor.content.add(p); }
    motor.frame();
    motor.select([piezas[2]]);

    const preset = document.getElementById('preset'), modo = document.getElementById('modo');
    preset.innerHTML = Object.keys(PRESETS).map((p) => `<option>${p}</option>`).join('');
    modo.innerHTML = MODES.map((m) => `<option>${m}</option>`).join('');
    preset.onchange = () => motor.setPreset(preset.value);
    modo.onchange = () => { motor.mode = modo.value; };
    for (const b of document.querySelectorAll('[data-show]')) b.onclick = () => motor.show({ [b.dataset.show]: !motor.show()[b.dataset.show] });
    document.getElementById('bordes').onclick = () => motor.edges({ enabled: !motor.edges().enabled });
    document.getElementById('render').onclick = async (e) => {
      const b = e.currentTarget;
      const png = await motor.render({ samples: 128, onProgress: (f) => { b.textContent = `render ${Math.round(f * 100)}%`; } });
      b.textContent = 'render';
      const img = document.getElementById('salida');
      img.src = URL.createObjectURL(png);
      img.style.display = 'block';
    };
    // la cámara con valores planos (motor.view): sin tocar three
    for (const b of document.querySelectorAll('[data-orbit]')) b.onclick = () => motor.view.orbit(+b.dataset.orbit, 0, { animate: true });
    const vista = document.getElementById('vista');
    vista.innerHTML = '<option value="">vista…</option>' + Object.keys(motor.VIEWS).map((v) => `<option>${v}</option>`).join('');
    vista.onchange = () => { if (vista.value) motor.view.go(vista.value, { animate: true }); vista.value = ''; };
    document.getElementById('encuadrar').onclick = () => motor.view.fit(motor.selected.length ? motor.selected : undefined, { animate: true });
    let guardada = JSON.stringify(motor.view.get());
    document.getElementById('guardar').onclick = () => { guardada = JSON.stringify(motor.view.get()); };
    document.getElementById('volver').onclick = () => motor.view.set(JSON.parse(guardada), { animate: true });
    Object.assign(window, { motor, THREE, piezas });
  </script>
</body>
</html>
