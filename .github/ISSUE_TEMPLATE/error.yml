name: Error
description: El módulo no hace lo que promete (la API, la documentación o help()).
labels: [triage, error]
body:
  - type: markdown
    attributes:
      value: |
        Si "no anda" quiere decir "no hace lo que mi app necesita", es un **Pedido**, no un error.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Lo mínimo que lo muestra. Ideal sobre examples/index.html, o un pedazo de código corto.
    validations:
      required: true
  - type: textarea
    id: versiones
    attributes:
      label: Versiones
      description: Del motor, de three (y de three-gpu-pathtracer si es en render()), el navegador, y lo que imprime motor.gpu().
    validations:
      required: true
  - type: textarea
    id: consola
    attributes:
      label: Errores en la consola
      render: text
